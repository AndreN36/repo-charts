deployments:
  giropopsSenhas:
    name: "giropops-senhas"
    image: "linuxtips/giropops-senhas:1.0"
    replicas: 5
    port: 5000

    labels:
      app: "giropops-senhas"
      env: "labs"
      live: "true"

    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"

  redis:
    name: "redis-deployment"
    image: "redis"
    replicas: 1
    port: 6379

    labels:
      app: "redis"

    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"

services:
  giropopsSenhas:
    name: "giropops-senhas-svc"
    type: "ClusterIP"

    labels:
      app: "giropops-senhas"
      env: "labs"
      live: "true"

    ports:
      - port: 5000
        targetPort: 5000
        name: "giropops-senhas-port"
        serviceType: "NodePort"

      - port: 8088
        targetPort: 8088
        name: "giropops-senhas-metrics"
        serviceType: "ClusterIP"

    selector:
      app: "giropops-senhas"

  redis:
    name: "redis-service"
    type: "ClusterIP"
    port: 6379
    targetPort: 6379

    labels:
      app: "redis"
      env: "labs"
      live: "true"

    selector:
      app: "redis"

observability:
  giropops-senhas:
    logging: true
    metrics:
      enabled: true
      path: "/metrics"

databases:
  giropops-senhas:
    type: "MySQL"
    host: "mysql.svc.cluster.local"
    port: "3306"
    name: "MyDB"